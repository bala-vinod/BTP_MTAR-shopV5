ID: Shop_MTA_V5
_schema-version: '3.1'
description: Shop MTA V5 Project
version: 0.0.1

parameters:
  dep-space: dev
  xs-uaa-app-name: shopv5_dev
  app_name: shopv5



  ext_redirecturl:
    - 'https://*.hana.ondemand.com/**'
 
modules:
 - name: shopv5
   type: html5
   path: sample.Shop
   parameters:
      disk-quota: 512M
      memory: 512M
   build-parameters:
      builder: grunt
   requires:
    - name: uaa_Shop_MTA_V5
    - name: dest_Shop_MTA_V5

resources:
 - name: uaa_Shop_MTA_V5
   parameters:
      path: ./xs-security.json
      service-plan: application
      config:
         xsappname: ${xs-uaa-app-name}
         oauth2-configuration:
           redirect-uris: ${ext_redirecturl}
      service: xsuaa
   type: org.cloudfoundry.managed-service

 - name: dest_Shop_MTA_V5
   parameters:
      service-plan: lite
      service: destination
   type: org.cloudfoundry.managed-service

